[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stl-decision-trees"
version = "0.1.0"
description = "Max-flow MILP learning of Signal Temporal Logic decision trees"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Kaier Liang"}, {name = "Gustavo A. Cardona"}, {name = "Disha Kamale"}, {name = "Cristian-Ioan Vasile"}]
dependencies = ["numpy>=1.24", "gurobipy>=11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]
notebook = ["jupyterlab>=4", "matplotlib>=3.8"]

[project.scripts]
stl-tree = "stl_tree.cli:main"

[project.urls]
Repository = "https://github.com/KaierLiang/stl-decision-trees"
Paper = "https://arxiv.org/abs/2407.21090"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["solver: requires a working Gurobi license"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
